name: Scrape Khamsat Design Jobs

on:
  schedule:
    - cron: '*/30 8-19 * * *'   # كل 30 دقيقة من 9:00 إلى 19:30 (توقيت الجزائر)
    - cron: '0 20 * * *'        # آخر تشغيل الساعة 21:00 (توقيت الجزائر)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node scrape.js

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          git diff --staged --quiet || git commit -m "تحديث تلقائي لقائمة الطلبات"
          git push
